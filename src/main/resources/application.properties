# ==============================================================================
# Laboratory Work No. 8: University Management System
# Multi-Database Configuration (student_db, course_db, grade_db)
# ==============================================================================

spring.application.name=university-management-system
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

# Common Hibernate / JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------------------------------------------
# Database 1: student_db
# ------------------------------------------------------------------------------
spring.datasource.student.url=${STUDENT_DB_URL:jdbc:postgresql://localhost:5432/student_db}
spring.datasource.student.username=${STUDENT_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.student.password=${STUDENT_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.student.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# Database 2: course_db
# ------------------------------------------------------------------------------
spring.datasource.course.url=${COURSE_DB_URL:jdbc:postgresql://localhost:5432/course_db}
spring.datasource.course.username=${COURSE_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.course.password=${COURSE_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.course.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# Database 3: grade_db
# ------------------------------------------------------------------------------
spring.datasource.grade.url=${GRADE_DB_URL:jdbc:postgresql://localhost:5432/grade_db}
spring.datasource.grade.username=${GRADE_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.grade.password=${GRADE_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.grade.driver-class-name=org.postgresql.Driver
