# ==============================================================================
# Laboratory Work No. 8: Test Profile (H2 PostgreSQL Compatibility Mode)
# Allows fast, isolated, fail-proof unit and integration testing without external DB
# ==============================================================================

spring.application.name=university-management-system-test

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# student_db in-memory
spring.datasource.student.url=jdbc:h2:mem:student_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.student.username=sa
spring.datasource.student.password=
spring.datasource.student.driver-class-name=org.h2.Driver

# course_db in-memory
spring.datasource.course.url=jdbc:h2:mem:course_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.course.username=sa
spring.datasource.course.password=
spring.datasource.course.driver-class-name=org.h2.Driver

# grade_db in-memory
spring.datasource.grade.url=jdbc:h2:mem:grade_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.grade.username=sa
spring.datasource.grade.password=
spring.datasource.grade.driver-class-name=org.h2.Driver
